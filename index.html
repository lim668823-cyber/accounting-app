<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易记账 - 暗黑主题</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
        }

        /* 主容器大卡片 */
        .main-card {
            width: 100%;
            max-width: 540px;
            background: linear-gradient(145deg, #1a1a2e 0%, #16162a 100%);
            border-radius: 28px;
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(99, 102, 241, 0.05);
        }

        /* 头部标题 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 26px;
            font-weight: 500;
            background: linear-gradient(90deg, #818cf8, #6366f1, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .date-display {
            font-size: 12px;
            color: #6b7280;
        }

        /* 用户信息栏 */
        .user-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .user-info {
            display: none;
            /* 隐藏用户信息区域 */
        }

        .logout-btn {
            padding: 6px 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            color: #f87171;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .auth-links {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 7px 12px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            color: #818cf8;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: rgba(99, 102, 241, 0.2);
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* 蓝色余额卡片 */
        .balance-card {
            background: linear-gradient(to bottom right, #6366f1 0%, #4338ca 40%, #312e81 100%);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 15px 40px rgba(99, 102, 241, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .balance-card::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -15%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .balance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .balance-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .balance-month {
            font-size: 12px;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .balance-amount {
            font-size: 52px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            letter-spacing: -1px;
        }

        .balance-amount.negative {
            color: #fca5a5;
        }

        /* 白色分割线 */
        .white-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        /* 收入支出区域 */
        .stats-row {
            display: flex;
            position: relative;
            z-index: 1;
        }

        .mini-stat {
            flex: 1;
        }

        .mini-stat.income {
            text-align: left;
            padding-right: 20px;
        }

        .mini-stat.expense {
            text-align: left;
            padding-left: 20px;
        }

        .mini-stat .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
            font-weight: 400;
        }

        .mini-stat .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
        }

        /* 预算分项区域 */
        .budget-section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 18px;
            position: relative;
            /* Added for ::before positioning */
            padding-left: 10px;
            /* Added for ::before spacing */
            display: flex;
            /* Added for ::before alignment */
            align-items: center;
            /* Added for ::before alignment */
        }

        .section-title::before {
            content: '';
            position: absolute;
            left: 0;
            width: 3px;
            height: 16px;
            background: linear-gradient(180deg, #6366f1, #818cf8);
            border-radius: 2px;
        }

        .budget-item {
            margin-bottom: 16px;
        }

        .budget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .budget-name {
            font-size: 13px;
            color: #e5e7eb;
            font-weight: 500;
        }

        .budget-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .budget-amount {
            font-size: 13px;
            color: #9ca3af;
        }

        .progress-bar {
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #312e81, #6366f1);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .progress-fill.warning {
            background: linear-gradient(90deg, #d97706, #f59e0b);
        }

        .progress-fill.danger {
            background: linear-gradient(90deg, #dc2626, #ef4444);
        }

        /* 交易记录 */
        .history-header {
            margin-bottom: 16px;
        }

        .transaction-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
        }

        .transaction-list::-webkit-scrollbar {
            width: 4px;
        }

        .transaction-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .transaction-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .tx-item {
            display: flex;
            align-items: center;
            padding: 14px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            transition: all 0.3s;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tx-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .tx-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 12px;
        }

        .tx-icon.income {
            background: rgba(16, 185, 129, 0.15);
        }

        .tx-icon.expense {
            background: rgba(239, 68, 68, 0.15);
        }

        .tx-info {
            flex: 1;
        }

        .tx-desc {
            font-size: 14px;
            font-weight: 500;
            color: #e5e7eb;
            margin-bottom: 2px;
        }

        .tx-date {
            font-size: 11px;
            color: #4b5563;
        }

        .tx-amount {
            font-size: 15px;
            font-weight: 600;
        }

        .tx-amount.income {
            color: #34d399;
        }

        .tx-amount.expense {
            color: #f87171;
        }

        .tx-delete {
            margin-left: 10px;
            width: 28px;
            height: 28px;
            border: none;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-radius: 7px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            font-size: 14px;
        }

        .tx-item:hover .tx-delete {
            opacity: 1;
        }

        .tx-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-text {
            color: #4b5563;
            font-size: 13px;
        }

        /* 悬浮按钮 */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #312e81 100%);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            transition: all 0.3s;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.5);
        }

        .fab.active {
            transform: rotate(45deg);
        }

        /* 抽屉遮罩 */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 200;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 抽屉 */
        .drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(145deg, #1a1a2e 0%, #16162a 100%);
            border-radius: 24px 24px 0 0;
            padding: 24px;
            padding-bottom: 40px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 300;
            max-width: 540px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-bottom: none;
        }

        .drawer.active {
            transform: translateY(0);
        }

        .drawer-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        .drawer-title {
            font-size: 18px;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 20px;
            text-align: center;
        }

        .type-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .type-tab {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #6b7280;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .type-tab.active {
            color: #fff;
        }

        .type-tab.active.expense {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .type-tab.active.income {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: transparent;
            color: #9ca3af;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-tab.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            color: #818cf8;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .input-field {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 13px 16px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .input-field::placeholder {
            color: #4b5563;
        }

        .input-field:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input-field.amount {
            flex: 0.6;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #312e81 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        }

        /* 底部装饰光晕 */
        .glow-effect {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 150px;
            background: radial-gradient(ellipse, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- 主卡片容器 -->
    <div class="main-card">
        <!-- 头部 -->
        <header class="header">
            <h1 class="logo">我的账单统计</h1>
            <span class="date-display" id="currentDate"></span>
        </header>

        <!-- 用户信息栏 -->
        <div class="user-bar">
            <div id="authLinks" class="auth-links">
                <a href="login.html?tab=login" class="nav-btn">登录</a>
                <a href="login.html?tab=register" class="nav-btn">注册</a>
            </div>
            <button class="logout-btn" id="logoutBtn" style="display: none;">退出登录</button>
        </div>

        <!-- 蓝色余额卡片 -->
        <div class="balance-card">
            <div class="balance-header">
                <span class="balance-label">本月总预算结余</span>
                <span class="balance-month" id="monthLabel"></span>
            </div>
            <div class="balance-amount" id="balance">¥0.00</div>

            <!-- 白色分割线 -->
            <div class="white-divider"></div>

            <!-- 收入支出简化显示 -->
            <div class="stats-row">
                <div class="mini-stat income">
                    <div class="stat-label">收入</div>
                    <div class="stat-value" id="income">¥0</div>
                </div>
                <div class="mini-stat expense">
                    <div class="stat-label">支出</div>
                    <div class="stat-value" id="expense">¥0</div>
                </div>
            </div>
        </div>

        <!-- 预算分项执行 -->
        <section class="budget-section">
            <h3 class="section-title">预算分项执行</h3>

            <!-- 餐饮 -->
            <div class="budget-item" data-category="餐饮">
                <div class="budget-header">
                    <span class="budget-name">🍜 餐饮</span>
                    <div class="budget-info">
                        <span class="budget-amount">¥<span id="food-used">0</span> / ¥2,500</span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="food-progress" style="width: 0%"></div>
                </div>
            </div>

            <!-- 交通 -->
            <div class="budget-item" data-category="交通">
                <div class="budget-header">
                    <span class="budget-name">🚗 交通</span>
                    <div class="budget-info">
                        <span class="budget-amount">¥<span id="transport-used">0</span> / ¥1,000</span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="transport-progress" style="width: 0%"></div>
                </div>
            </div>

            <!-- 购物 -->
            <div class="budget-item" data-category="购物">
                <div class="budget-header">
                    <span class="budget-name">🛒 购物</span>
                    <div class="budget-info">
                        <span class="budget-amount">¥<span id="shopping-used">0</span> / ¥3,000</span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="shopping-progress" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <!-- 交易记录 -->
        <section class="history-section">
            <div class="history-header">
                <h3 class="section-title">交易记录</h3>
            </div>
            <ul class="transaction-list" id="list"></ul>
        </section>
    </div>

    <!-- 悬浮按钮 -->
    <button class="fab" id="fabBtn">+</button>

    <!-- 抽屉遮罩 -->
    <div class="drawer-overlay" id="overlay"></div>

    <!-- 底部抽屉 -->
    <div class="drawer" id="drawer">
        <div class="drawer-handle"></div>
        <h3 class="drawer-title">新增记录</h3>

        <div class="type-tabs">
            <button class="type-tab expense active" data-type="expense">
                <span>💸</span> 支出
            </button>
            <button class="type-tab income" data-type="income">
                <span>💰</span> 收入
            </button>
        </div>

        <div class="category-tabs" id="categoryTabs">
            <button class="category-tab active" data-category="餐饮">🍜 餐饮</button>
            <button class="category-tab" data-category="交通">🚗 交通</button>
            <button class="category-tab" data-category="购物">🛒 购物</button>
            <button class="category-tab" data-category="其他">📦 其他</button>
        </div>

        <div class="input-row">
            <input type="text" class="input-field" id="desc" placeholder="描述（可选）">
            <input type="number" class="input-field amount" id="amount" placeholder="金额" step="0.01" min="0">
        </div>
        <button class="submit-btn" id="addBtn">✨ 添加记录</button>
    </div>

    <div class="glow-effect"></div>

    <script>
        // ==================== Supabase 配置 ====================
        const SUPABASE_URL = 'https://iggizydrjexfdqalcumo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnZ2l6eWRyamV4ZmRxYWxjdW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NjA5NDMsImV4cCI6MjA4NTMzNjk0M30.kwbQs_2DKOb7WowapFHHEVuvqdgDowBwgtJH6lPUX_k';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==================== 登录状态检查 ====================
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const userId = currentUser ? currentUser.id : null;

        // 如果未登录，初始化为空状态
        if (!currentUser) {
            console.log('未登录，显示访客模式');
        }

        // ==================== 工具函数 ====================
        // 格式化数字，添加千位分隔符
        function formatNumber(num, decimals = 0) {
            const n = typeof num === 'string' ? parseFloat(num) : num;
            return n.toLocaleString('zh-CN', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        }

        // 格式化日期显示（今天/昨天/前天 或 日期 + 时间 + 分类）
        function formatDateDisplay(timestamp, category) {
            const txDate = new Date(timestamp);
            const now = new Date();

            // 获取今天、昨天、前天的日期（只比较年月日）
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const dayBeforeYesterday = new Date(today);
            dayBeforeYesterday.setDate(dayBeforeYesterday.getDate() - 2);
            const threeDaysAgo = new Date(today);
            threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);

            const txDateOnly = new Date(txDate.getFullYear(), txDate.getMonth(), txDate.getDate());

            let dateStr;
            if (txDateOnly.getTime() === today.getTime()) {
                dateStr = '今天';
            } else if (txDateOnly.getTime() === yesterday.getTime()) {
                dateStr = '昨天';
            } else if (txDateOnly.getTime() === dayBeforeYesterday.getTime()) {
                dateStr = '前天';
            } else {
                // 三天之外用日期表示
                dateStr = `${txDate.getMonth() + 1}月${txDate.getDate()}日`;
            }

            // 获取时间（几点几分）
            const hours = txDate.getHours().toString().padStart(2, '0');
            const minutes = txDate.getMinutes().toString().padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;

            return `${dateStr} ${timeStr} · ${category}`;
        }

        // ==================== 预算配置 ====================
        const BUDGETS = {
            '餐饮': 2500,
            '交通': 1000,
            '购物': 3000
        };

        // ==================== 数据状态 ====================
        let transactions = [];
        let currentType = 'expense';
        let currentCategory = '餐饮';
        let isLoading = false;

        // ==================== Supabase 数据操作 ====================
        // 从 Supabase 加载交易记录
        async function loadTransactions() {
            if (!userId) {
                render(); // 显示空列表
                return;
            }
            isLoading = true;
            try {
                const { data, error } = await supabaseClient
                    .from('transactions')
                    .select('*')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                transactions = data.map(t => ({
                    id: t.id,
                    type: t.type,
                    category: t.category,
                    desc: t.description || t.category,
                    amount: parseFloat(t.amount),
                    timestamp: new Date(t.created_at).getTime()
                }));
                render();
            } catch (error) {
                console.error('加载数据失败:', error);
                // 如果云端加载失败，尝试从本地恢复
                transactions = JSON.parse(localStorage.getItem('transactions_dark') || '[]');
                render();
            } finally {
                isLoading = false;
            }
        }

        // 保存单条记录到 Supabase
        async function saveTransaction(transaction) {
            try {
                const { data, error } = await supabaseClient.from('transactions').insert({
                    type: transaction.type,
                    category: transaction.category,
                    description: transaction.desc,
                    amount: transaction.amount,
                    user_id: userId
                }).select().single();

                if (error) throw error;
                return data;
            } catch (error) {
                console.error('保存失败:', error);
                // 保存到本地作为备份
                const localData = JSON.parse(localStorage.getItem('transactions_dark') || '[]');
                localData.unshift(transaction);
                localStorage.setItem('transactions_dark', JSON.stringify(localData));
                return null;
            }
        }

        // 从 Supabase 删除记录
        async function deleteTransaction(id) {
            try {
                const { error } = await supabaseClient
                    .from('transactions')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                return true;
            } catch (error) {
                console.error('删除失败:', error);
                return false;
            }
        }

        // 迁移本地数据到云端（首次使用时调用）
        async function migrateLocalData() {
            const localData = JSON.parse(localStorage.getItem('transactions_dark') || '[]');
            if (localData.length === 0) return;

            console.log('正在迁移本地数据到云端...');
            try {
                const records = localData.map(t => ({
                    type: t.type,
                    category: t.category,
                    description: t.desc,
                    amount: t.amount,
                    user_id: userId,
                    created_at: new Date(t.timestamp || t.id).toISOString()
                }));

                const { error } = await supabaseClient.from('transactions').insert(records);
                if (error) throw error;

                // 迁移成功后清除本地数据
                localStorage.removeItem('transactions_dark');
                console.log('数据迁移完成！');
                await loadTransactions();
            } catch (error) {
                console.error('数据迁移失败:', error);
            }
        }

        // 元素
        const balanceEl = document.getElementById('balance');
        const incomeEl = document.getElementById('income');
        const expenseEl = document.getElementById('expense');
        const listEl = document.getElementById('list');
        const descInput = document.getElementById('desc');
        const amountInput = document.getElementById('amount');
        const addBtn = document.getElementById('addBtn');
        const typeTabs = document.querySelectorAll('.type-tab');
        const categoryTabs = document.querySelectorAll('.category-tab');
        const dateEl = document.getElementById('currentDate');
        const monthLabel = document.getElementById('monthLabel');
        const fabBtn = document.getElementById('fabBtn');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');
        const categoryTabsContainer = document.getElementById('categoryTabs');

        // 显示当前日期
        const now = new Date();
        dateEl.textContent = now.toLocaleDateString('zh-CN', {
            month: 'short',
            day: 'numeric',
            weekday: 'short'
        });
        monthLabel.textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long'
        });

        // ==================== 导航与登录处理 ====================
        const logoutBtn = document.getElementById('logoutBtn');
        const authLinks = document.getElementById('authLinks');

        if (currentUser) {
            if (logoutBtn) logoutBtn.style.display = 'block';
            if (authLinks) authLinks.style.display = 'none';
        } else {
            if (logoutBtn) logoutBtn.style.display = 'none';
            if (authLinks) authLinks.style.display = 'flex';
        }

        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                if (confirm('确定要退出登录吗？')) {
                    localStorage.removeItem('currentUser');
                    window.location.reload(); // 刷新当前页面回到游客状态
                }
            });
        }

        // 抽屉控制
        fabBtn.addEventListener('click', toggleDrawer);
        overlay.addEventListener('click', closeDrawer);

        function toggleDrawer() {
            drawer.classList.toggle('active');
            overlay.classList.toggle('active');
            fabBtn.classList.toggle('active');
        }

        function closeDrawer() {
            drawer.classList.remove('active');
            overlay.classList.remove('active');
            fabBtn.classList.remove('active');
        }

        // 切换类型
        typeTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                typeTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentType = tab.dataset.type;
                // 收入时隐藏分类
                categoryTabsContainer.style.display = currentType === 'income' ? 'none' : 'flex';
            });
        });

        // 切换分类
        categoryTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                categoryTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
            });
        });

        // 添加记录
        addBtn.addEventListener('click', add);
        amountInput.addEventListener('keypress', e => e.key === 'Enter' && add());

        async function add() {
            const desc = descInput.value.trim() || currentCategory;
            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount <= 0) {
                addBtn.style.animation = 'shake 0.4s';
                setTimeout(() => addBtn.style.animation = '', 400);
                return;
            }

            const newTx = {
                id: Date.now(),
                type: currentType,
                category: currentType === 'expense' ? currentCategory : '收入',
                desc,
                amount,
                timestamp: Date.now()
            };

            // 先更新本地UI，再保存到云端
            transactions.unshift(newTx);
            render();
            descInput.value = '';
            amountInput.value = '';
            closeDrawer();

            // 异步保存到 Supabase
            const saved = await saveTransaction(newTx);
            if (saved) {
                // 更新本地记录的 ID 为云端生成的 ID
                newTx.id = saved.id;
            }
        }

        // 删除记录
        window.del = async function (id) {
            // 先从本地移除
            transactions = transactions.filter(t => t.id !== id);
            render();

            // 异步从云端删除
            await deleteTransaction(id);
        };

        // 渲染
        function render() {
            const inc = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const exp = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            const bal = inc - exp;

            balanceEl.textContent = `¥${formatNumber(bal, 2)}`;
            balanceEl.className = 'balance-amount' + (bal < 0 ? ' negative' : '');
            incomeEl.textContent = `¥${formatNumber(Math.floor(inc))}`;
            expenseEl.textContent = `¥${formatNumber(Math.floor(exp))}`;

            // 更新预算进度
            updateBudgetProgress();

            // 渲染交易列表
            if (!transactions.length) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <p class="empty-text">暂无交易记录</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = transactions.map(t => `
                <li class="tx-item">
                    <div class="tx-icon ${t.type}">
                        ${t.type === 'income' ? '💰' : getCategoryIcon(t.category)}
                    </div>
                    <div class="tx-info">
                        <div class="tx-desc">${t.desc}</div>
                        <div class="tx-date">${formatDateDisplay(t.timestamp || t.id, t.category)}</div>
                    </div>
                    <span class="tx-amount ${t.type}">
                        ${t.type === 'income' ? '+' : '-'}¥${formatNumber(t.amount, 2)}
                    </span>
                    <button class="tx-delete" onclick="del(${t.id})">✕</button>
                </li>
            `).join('');
        }

        function getCategoryIcon(category) {
            const icons = {
                '餐饮': '🍜',
                '交通': '🚗',
                '购物': '🛒',
                '其他': '📦'
            };
            return icons[category] || '💳';
        }

        function updateBudgetProgress() {
            // 计算各分类支出
            const categoryExpenses = {
                '餐饮': 0,
                '交通': 0,
                '购物': 0
            };

            transactions
                .filter(t => t.type === 'expense')
                .forEach(t => {
                    if (categoryExpenses[t.category] !== undefined) {
                        categoryExpenses[t.category] += t.amount;
                    }
                });

            // 更新餐饮
            const foodUsed = categoryExpenses['餐饮'];
            const foodPercent = Math.min((foodUsed / BUDGETS['餐饮']) * 100, 100);
            document.getElementById('food-used').textContent = formatNumber(Math.floor(foodUsed));
            const foodProgress = document.getElementById('food-progress');
            foodProgress.style.width = foodPercent + '%';
            foodProgress.className = 'progress-fill' + getProgressClass(foodPercent);

            // 更新交通
            const transportUsed = categoryExpenses['交通'];
            const transportPercent = Math.min((transportUsed / BUDGETS['交通']) * 100, 100);
            document.getElementById('transport-used').textContent = formatNumber(Math.floor(transportUsed));
            const transportProgress = document.getElementById('transport-progress');
            transportProgress.style.width = transportPercent + '%';
            transportProgress.className = 'progress-fill' + getProgressClass(transportPercent);

            // 更新购物
            const shoppingUsed = categoryExpenses['购物'];
            const shoppingPercent = Math.min((shoppingUsed / BUDGETS['购物']) * 100, 100);
            document.getElementById('shopping-used').textContent = formatNumber(Math.floor(shoppingUsed));
            const shoppingProgress = document.getElementById('shopping-progress');
            shoppingProgress.style.width = shoppingPercent + '%';
            shoppingProgress.className = 'progress-fill' + getProgressClass(shoppingPercent);
        }

        function getProgressClass(percent) {
            if (percent >= 100) return ' danger';
            if (percent >= 80) return ' warning';
            return '';
        }

        // 初始化：加载云端数据
        loadTransactions();

        // 检查是否需要迁移本地数据
        if (localStorage.getItem('transactions_dark')) {
            migrateLocalData();
        }

        // 抖动动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-6px); }
                40% { transform: translateX(6px); }
                60% { transform: translateX(-4px); }
                80% { transform: translateX(4px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
