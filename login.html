<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 简易记账</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(145deg, #1a1a2e 0%, #16162a 100%);
            border-radius: 28px;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(99, 102, 241, 0.05);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            font-size: 32px;
            font-weight: 500;
            background: linear-gradient(90deg, #818cf8, #6366f1, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #6b7280;
        }

        /* 标签切换 */
        .tab-container {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* 表单 */
        .form-container {
            position: relative;
            min-height: 280px;
        }

        .auth-form {
            position: absolute;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            transform: translateX(20px);
            transition: all 0.3s ease;
        }

        .auth-form.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .input-field::placeholder {
            color: #4b5563;
        }

        .input-field:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #312e81 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
        }

        .submit-btn:hover {
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 提示消息 */
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            display: block;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            display: block;
        }

        /* 底部光晕 */
        .glow-effect {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 150px;
            background: radial-gradient(ellipse, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <header class="auth-header">
            <h1 class="auth-logo">简易记账</h1>
            <p class="auth-subtitle">管理你的每一笔收支</p>
        </header>

        <!-- 标签切换 -->
        <div class="tab-container">
            <button class="tab-btn active" data-tab="login">登录</button>
            <button class="tab-btn" data-tab="register">注册</button>
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <a href="index.html" style="color: #6b7280; font-size: 13px; text-decoration: none;">← 返回主页</a>
        </div>

        <div id="message" class="message"></div>

        <div class="form-container">
            <!-- 登录表单 -->
            <form class="auth-form active" id="loginForm">
                <div class="input-group">
                    <label class="input-label">手机号或邮箱</label>
                    <input type="text" class="input-field" id="loginUsername" placeholder="请输入手机号或邮箱" required>
                </div>
                <div class="input-group">
                    <label class="input-label">密码</label>
                    <input type="password" class="input-field" id="loginPassword" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">登录</button>
            </form>

            <!-- 注册表单 -->
            <form class="auth-form" id="registerForm">
                <div class="input-group">
                    <label class="input-label">手机号或邮箱</label>
                    <input type="text" class="input-field" id="regUsername" placeholder="请输入手机号或邮箱" required>
                </div>
                <div class="input-group">
                    <label class="input-label">密码</label>
                    <input type="password" class="input-field" id="regPassword" placeholder="至少6个字符" required
                        minlength="6">
                </div>
                <button type="submit" class="submit-btn" id="regBtn">注册</button>
            </form>
        </div>
    </div>

    <div class="glow-effect"></div>

    <script>
        // ==================== Supabase 配置 ====================
        const SUPABASE_URL = 'https://iggizydrjexfdqalcumo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnZ2l6eWRyamV4ZmRxYWxjdW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NjA5NDMsImV4cCI6MjA4NTMzNjk0M30.kwbQs_2DKOb7WowapFHHEVuvqdgDowBwgtJH6lPUX_k';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==================== 检查登录状态 ====================
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            // 已登录，跳转到主页
            window.location.href = 'index.html';
        }

        // ==================== 元素 ====================
        const tabBtns = document.querySelectorAll('.tab-btn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const messageEl = document.getElementById('message');

        // ==================== 标签切换 ====================
        function switchTab(tab) {
            tabBtns.forEach(btn => {
                if (btn.dataset.tab === tab) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (tab === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
            }
            hideMessage();
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        // 检查 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const initialTab = urlParams.get('tab');
        if (initialTab === 'register') {
            switchTab('register');
        } else {
            switchTab('login');
        }

        // ==================== 消息显示 ====================
        function showMessage(text, type = 'error') {
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
        }

        function hideMessage() {
            messageEl.className = 'message';
        }

        // ==================== 简单的密码哈希（生产环境应使用bcrypt等） ====================
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + 'accounting_salt_2024');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ==================== 注册 ====================
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const regBtn = document.getElementById('regBtn');

            regBtn.disabled = true;
            regBtn.innerHTML = '<span class="loading"></span>注册中...';

            try {
                // 检查用户名是否已存在
                const { data: existing } = await supabaseClient
                    .from('users')
                    .select('id')
                    .eq('username', username)
                    .single();

                if (existing) {
                    showMessage('用户名已被注册');
                    return;
                }

                // 创建用户
                const passwordHash = await hashPassword(password);
                const { data, error } = await supabaseClient
                    .from('users')
                    .insert({ username, password_hash: passwordHash })
                    .select()
                    .single();

                if (error) throw error;

                showMessage('注册成功！正在跳转...', 'success');

                // 自动登录
                localStorage.setItem('currentUser', JSON.stringify({
                    id: data.id,
                    username: data.username
                }));

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('注册失败:', error);
                showMessage('注册失败，请重试');
            } finally {
                regBtn.disabled = false;
                regBtn.textContent = '注册';
            }
        });

        // ==================== 登录 ====================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span>登录中...';

            try {
                const passwordHash = await hashPassword(password);

                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password_hash', passwordHash)
                    .single();

                if (error || !data) {
                    showMessage('用户名或密码错误');
                    return;
                }

                // 保存登录状态
                localStorage.setItem('currentUser', JSON.stringify({
                    id: data.id,
                    username: data.username
                }));

                showMessage('登录成功！', 'success');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);

            } catch (error) {
                console.error('登录失败:', error);
                showMessage('登录失败，请重试');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });
    </script>
</body>

</html>
